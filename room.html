<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting room — TutorMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div id="prejoin-screen" class="prejoin-wrap">
  <div class="prejoin-card">
    <span class="section-label">You're about to join</span>
    <span class="loc-pill" id="pj-live-badge" style="background:var(--red); color:#fff; display:none;">🔴 LIVE NOW</span>
    <h2 class="mt-2 mb-1" id="pj-title">Session</h2>
    <p class="text-secondary" id="pj-subline">Loading session details…</p>

    <div class="row g-4 mt-1">
      <div class="col-md-6">
        <div class="cam-preview-box" id="cam-preview-box">
          <span class="cam-off-badge">Camera off</span>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="ctrl-btn active" id="pj-toggle-cam" title="Toggle camera">🎥</button>
          <button class="ctrl-btn active" id="pj-toggle-mic" title="Toggle mic">🎤</button>
        </div>
        <p class="small text-secondary mt-2 mb-0" id="pj-permission-note">Enable your camera & mic so others can see and hear you (requires browser permission).</p>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <span class="stat-chip d-inline-block mb-2" id="pj-loc-chip">Location</span>
        </div>
        <p class="mb-2" id="pj-description"></p>
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="avatar-ring" style="width:38px;height:38px;font-size:.85rem;" id="pj-host-initials"></div>
          <span class="small text-secondary" id="pj-host-name"></span>
        </div>
        <button class="btn btn-mentee w-100 mt-3" id="pj-join-btn">Join Now</button>
        <a href="#" class="btn btn-ghost-tm w-100 mt-1" id="pj-back-link">← Back to dashboard</a>
      </div>
    </div>
  </div>
</div>

<div id="call-screen" class="room-shell d-none">
  <div class="d-flex align-items-center justify-content-between px-3 py-2" style="background:#1c1d38;">
    <div class="d-flex align-items-center gap-2">
      <span class="tm-brand" style="color:#fff !important; font-size:1rem;"><span class="dot"></span>TutorMeet</span>
      <span class="text-secondary small" id="call-title-label"></span>
    </div>
    <div id="rec-indicator-top" class="d-none">
      <span class="rec-timer"><span class="blink" style="width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block;"></span> <span id="rec-timer-text">00:00</span></span>
    </div>
  </div>

  <div class="video-grid" id="video-grid"></div>

  <div class="control-bar">
    <button class="ctrl-btn active" id="btn-mic" title="Mute / unmute">🎤</button>
    <button class="ctrl-btn active" id="btn-cam" title="Camera on / off">🎥</button>
    <button class="ctrl-btn rec" id="btn-record" title="Record session">⏺</button>
    <button class="ctrl-btn" id="btn-calc" title="Calculator">🧮</button>
    <button class="ctrl-btn" id="btn-chat" title="Chat">💬</button>
    <button class="ctrl-btn" id="btn-participants" title="Participants">👥</button>
    <button class="ctrl-btn leave" id="btn-leave" title="Leave call">📞 Leave</button>
  </div>
</div>

<div class="side-panel" id="side-panel">
  <div class="sp-header">
    <strong id="sp-title">Chat</strong>
    <button class="btn-close btn-close-white" id="sp-close"></button>
  </div>
  <div class="sp-tabs">
    <button class="active" id="sp-tab-chat">Chat</button>
    <button id="sp-tab-participants">Participants</button>
  </div>
  <div id="sp-chat-view">
    <div class="chat-body" id="chat-body"></div>
    <form class="chat-input" id="chat-form">
      <input type="text" id="chat-text" placeholder="Message everyone..." autocomplete="off">
      <button class="ctrl-btn active" style="width:38px;height:38px;" type="submit">➤</button>
    </form>
  </div>
  <div id="sp-participants-view" class="d-none" style="padding-top:.5rem;"></div>
</div>

<div class="calc-panel" id="calc-panel">
  <div class="calc-header" id="calc-header">
    <span>🧮 Calculator</span>
    <button class="btn-close btn-close-white btn-sm" id="calc-close"></button>
  </div>
  <div class="calc-display" id="calc-display">0</div>
  <div class="calc-grid" id="calc-grid"></div>
</div>

<div class="download-toast d-none" id="download-toast">
  <span>Recording ready:</span>
  <a href="#" id="download-link" download="tutormeet-session.webm">Download .webm</a>
  <button class="btn-close btn-close-white btn-sm ms-2" id="toast-close"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
const user = getCurrentUser();
if (!user) window.location.href = "auth.html";

const sessionId = new URLSearchParams(window.location.search).get("session");
const session = getSessions().find(s => s.id === sessionId) || {
  title: "Practice Room", subject: "General", description: "A free-form practice room.",
  locationType: "online", locationDetail: "", mentorName: user.name
};

document.getElementById("pj-back-link").href = user.role === "mentor" ? "mentor-dashboard.html" : "mentee-dashboard.html";
document.getElementById("pj-title").textContent = session.title;
document.getElementById("pj-subline").textContent = `${session.subject} · hosted by ${session.mentorName}`;
document.getElementById("pj-description").textContent = session.description || "";
document.getElementById("pj-loc-chip").textContent = session.locationType === "online" ? "💻 Join Online" : `📍 ${session.locationDetail}`;
document.getElementById("pj-host-initials").textContent = initials(session.mentorName);
document.getElementById("pj-host-name").textContent = session.mentorName;
if (session.status === "live") document.getElementById("pj-live-badge").style.display = "inline-block";
document.getElementById("call-title-label").textContent = `${session.title} · ${session.subject}`;

/* ---------------- media state ---------------- */
let localStream = null;
let micOn = true, camOn = true;

async function setupPreviewCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    const box = document.getElementById("cam-preview-box");
    box.innerHTML = "";
    const video = document.createElement("video");
    video.autoplay = true; video.muted = true; video.playsInline = true;
    video.srcObject = localStream;
    box.appendChild(video);
    document.getElementById("pj-permission-note").textContent = "Camera & mic connected. You're ready to join.";
  } catch (err) {
    document.getElementById("pj-permission-note").textContent =
      "Couldn't access camera/mic (permission denied or unavailable). You can still join with camera off — recording needs camera access.";
  }
}
setupPreviewCamera();

document.getElementById("pj-toggle-cam").addEventListener("click", (e) => {
  camOn = !camOn;
  e.target.classList.toggle("off", !camOn);
  if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = camOn);
});
document.getElementById("pj-toggle-mic").addEventListener("click", (e) => {
  micOn = !micOn;
  e.target.classList.toggle("off", !micOn);
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = micOn);
});

/* ---------------- join call ---------------- */
document.getElementById("pj-join-btn").addEventListener("click", () => {
  document.getElementById("prejoin-screen").classList.add("d-none");
  document.getElementById("call-screen").classList.remove("d-none");
  if (user.role === "mentor" && session.id && session.status !== "live") {
    setSessionStatus(session.id, "live");
  }
  buildVideoGrid();
});

const mockParticipants = [
  { id: "p_host", name: session.mentorName || "Host", role: "mentor" },
  { id: "p_self", name: user.name, role: user.role, self: true },
  { id: "p_chidi", name: "Chidi Umeh", role: "mentee" },
  { id: "p_grace", name: "Grace Nwosu", role: "mentee" }
].filter(p => !(p.id === "p_host" && user.role === "mentor")); // don't show a duplicate tile when the mentor is themself the host

const participantState = {};
mockParticipants.forEach(p => { participantState[p.id] = { muted: false, removed: false, blocked: false }; });

const isHost = user.role === "mentor";

function buildVideoGrid() {
  const grid = document.getElementById("video-grid");
  grid.innerHTML = "";
  mockParticipants.forEach((p) => {
    const state = participantState[p.id];
    if (state.removed || state.blocked) return;
    const tile = document.createElement("div");
    tile.className = "video-tile";
    tile.id = p.self ? "self-tile" : `tile-${p.id}`;
    tile.innerHTML = `<div class="tile-avatar">${initials(p.name)}</div>
      <span class="tile-name">${p.self ? "You" : p.name}${state.muted && !p.self ? " · 🔇" : ""}</span>`;
    grid.appendChild(tile);
  });
  if (localStream && camOn && !participantState.p_self.removed) {
    const selfTile = document.getElementById("self-tile");
    if (selfTile) {
      selfTile.innerHTML = "";
      const video = document.createElement("video");
      video.autoplay = true; video.muted = true; video.playsInline = true;
      video.srcObject = localStream;
      selfTile.appendChild(video);
      const nameTag = document.createElement("span");
      nameTag.className = "tile-name"; nameTag.textContent = "You";
      selfTile.appendChild(nameTag);
    }
  }
  renderParticipants();
}

/* ---------------- controls: mic / cam ---------------- */
document.getElementById("btn-mic").addEventListener("click", (e) => {
  micOn = !micOn;
  e.target.classList.toggle("off", !micOn);
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = micOn);
});
document.getElementById("btn-cam").addEventListener("click", (e) => {
  camOn = !camOn;
  e.target.classList.toggle("off", !camOn);
  if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  buildVideoGrid();
});

/* ---------------- recording ---------------- */
let mediaRecorder = null, recordedChunks = [], recTimerInterval = null, recSeconds = 0;

document.getElementById("btn-record").addEventListener("click", async () => {
  const btn = document.getElementById("btn-record");
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    try {
      const stream = localStream || await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localStream = stream;
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm" });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        document.getElementById("download-link").href = url;
        document.getElementById("download-link").download = `tutormeet-${session.title.replace(/\s+/g,'-').toLowerCase()}-${Date.now()}.webm`;
        document.getElementById("download-toast").classList.remove("d-none");
      };
      mediaRecorder.start();
      btn.classList.add("recording");
      document.getElementById("rec-indicator-top").classList.remove("d-none");
      recSeconds = 0;
      recTimerInterval = setInterval(() => {
        recSeconds++;
        const m = String(Math.floor(recSeconds / 60)).padStart(2, "0");
        const s = String(recSeconds % 60).padStart(2, "0");
        document.getElementById("rec-timer-text").textContent = `${m}:${s}`;
      }, 1000);
    } catch (err) {
      alert("Recording needs camera & microphone permission. Please allow access and try again.");
    }
  } else {
    mediaRecorder.stop();
    btn.classList.remove("recording");
    clearInterval(recTimerInterval);
    document.getElementById("rec-indicator-top").classList.add("d-none");
  }
});
document.getElementById("toast-close").addEventListener("click", () => document.getElementById("download-toast").classList.add("d-none"));

/* ---------------- side panel: chat & participants ---------------- */
const sidePanel = document.getElementById("side-panel");
function openSidePanel(tab) {
  sidePanel.classList.add("open");
  switchTab(tab);
}
function closeSidePanel() { sidePanel.classList.remove("open"); }
document.getElementById("sp-close").addEventListener("click", closeSidePanel);
document.getElementById("btn-chat").addEventListener("click", () => openSidePanel("chat"));
document.getElementById("btn-participants").addEventListener("click", () => openSidePanel("participants"));

function switchTab(tab) {
  document.getElementById("sp-tab-chat").classList.toggle("active", tab === "chat");
  document.getElementById("sp-tab-participants").classList.toggle("active", tab === "participants");
  document.getElementById("sp-chat-view").classList.toggle("d-none", tab !== "chat");
  document.getElementById("sp-participants-view").classList.toggle("d-none", tab !== "participants");
  document.getElementById("sp-title").textContent = tab === "chat" ? "Chat" : "Participants";
}
document.getElementById("sp-tab-chat").addEventListener("click", () => switchTab("chat"));
document.getElementById("sp-tab-participants").addEventListener("click", () => switchTab("participants"));

let chatMessages = [
  { who: "Amara Chukwu", text: "Welcome! Feel free to drop questions any time.", me: false }
];
function renderChat() {
  const body = document.getElementById("chat-body");
  body.innerHTML = chatMessages.map(m => `
    <div class="chat-msg ${m.me ? 'me' : ''}">
      <span class="who">${m.me ? "You" : m.who}</span>${m.text}
    </div>`).join("");
  body.scrollTop = body.scrollHeight;
}
document.getElementById("chat-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-text");
  if (!input.value.trim()) return;
  chatMessages.push({ who: user.name, text: input.value.trim(), me: true });
  input.value = "";
  renderChat();
});
renderChat();

function renderParticipants() {
  const wrap = document.getElementById("sp-participants-view");
  const visible = mockParticipants.filter(p => !participantState[p.id].blocked);
  wrap.innerHTML = visible.map(p => {
    const state = participantState[p.id];
    const removedTag = state.removed ? `<span class="badge bg-secondary ms-2">Removed</span>` : "";
    const hostControls = (isHost && !p.self) ? `
      <div class="d-flex gap-1">
        <button class="btn btn-sm btn-outline-light" style="border-color:rgba(255,255,255,.2);" title="${state.muted ? 'Unmute' : 'Mute'}" onclick="toggleMuteParticipant('${p.id}')">${state.muted ? "🔇" : "🎤"}</button>
        <button class="btn btn-sm btn-outline-light" style="border-color:rgba(255,255,255,.2);" title="Remove from call" onclick="removeParticipant('${p.id}')" ${state.removed ? "disabled" : ""}>❌</button>
        <button class="btn btn-sm btn-outline-light" style="border-color:rgba(255,255,255,.2);" title="Block" onclick="blockParticipant('${p.id}')">🚫</button>
      </div>` : "";
    return `
    <div class="participant-row justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="p-avatar">${initials(p.name)}</div>
        <div>
          <div>${p.self ? "You" : p.name}${removedTag}</div>
          <div class="small text-secondary">${p.role === "mentor" ? "Mentor" : "Mentee"}${state.muted && !p.self ? " · muted" : ""}</div>
        </div>
      </div>
      ${hostControls}
    </div>`;
  }).join("");
}

function findParticipant(id) { return mockParticipants.find(p => p.id === id); }

function toggleMuteParticipant(id) {
  if (!isHost) return;
  participantState[id].muted = !participantState[id].muted;
  renderParticipants();
  buildVideoGrid();
}

function removeParticipant(id) {
  if (!isHost) return;
  const p = findParticipant(id);
  if (!confirm(`Remove ${p.name} from this call? They can rejoin later if the session is still live.`)) return;
  participantState[id].removed = true;
  renderParticipants();
  buildVideoGrid();
}

function blockParticipant(id) {
  if (!isHost) return;
  const p = findParticipant(id);
  if (!confirm(`Block ${p.name}? They won't be able to rejoin this session.`)) return;
  participantState[id].removed = true;
  participantState[id].blocked = true;
  renderParticipants();
  buildVideoGrid();
}

/* ---------------- calculator widget ---------------- */
const calcButtons = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","C","+","="];
const calcGrid = document.getElementById("calc-grid");
let calcExpr = "";
calcButtons.forEach(b => {
  const btn = document.createElement("button");
  btn.textContent = b;
  if (["/","*","-","+"].includes(b)) btn.classList.add("op");
  if (b === "=") btn.classList.add("eq");
  btn.addEventListener("click", () => handleCalcInput(b));
  calcGrid.appendChild(btn);
});
function handleCalcInput(val) {
  const display = document.getElementById("calc-display");
  if (val === "C") { calcExpr = ""; display.textContent = "0"; return; }
  if (val === "=") {
    try {
      if (!/^[0-9+\-*/.\s]+$/.test(calcExpr)) throw new Error("invalid");
      const result = Function(`"use strict"; return (${calcExpr})`)();
      display.textContent = String(result);
      calcExpr = String(result);
    } catch { display.textContent = "Error"; calcExpr = ""; }
    return;
  }
  calcExpr += val;
  display.textContent = calcExpr;
}
document.getElementById("btn-calc").addEventListener("click", () => {
  document.getElementById("calc-panel").classList.toggle("open");
});
document.getElementById("calc-close").addEventListener("click", () => {
  document.getElementById("calc-panel").classList.remove("open");
});

(function makeDraggable() {
  const panel = document.getElementById("calc-panel");
  const handle = document.getElementById("calc-header");
  let dragging = false, offsetX = 0, offsetY = 0;
  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - panel.getBoundingClientRect().left;
    offsetY = e.clientY - panel.getBoundingClientRect().top;
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    panel.style.left = (e.clientX - offsetX) + "px";
    panel.style.top = (e.clientY - offsetY) + "px";
    panel.style.right = "auto"; panel.style.bottom = "auto";
    panel.style.position = "fixed";
  });
  document.addEventListener("mouseup", () => dragging = false);
})();

/* ---------------- leave call ---------------- */
document.getElementById("btn-leave").addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (user.role === "mentor" && session.id && session.status === "live") {
    setSessionStatus(session.id, "ended");
  }
  window.location.href = user.role === "mentor" ? "mentor-dashboard.html" : "mentee-dashboard.html";
});
</script>
</body>
</html>
