<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select your students — TutorMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-shell">
  <div class="container" style="max-width: 900px;">
    <span class="section-label">Mentee requests</span>
    <h2 class="mt-2 mb-1">Select the students you're ready to take on</h2>
    <p class="text-secondary mb-4" id="onboarding-note">Accept a request to add that mentee to your roster — you'll see them under "My students" on your dashboard and can schedule sessions with them directly.</p>

    <div id="requests-list"></div>

    <div id="roster-section" class="mt-5">
      <span class="section-label d-block mb-2">Your students so far</span>
      <div id="roster-list" class="row g-3"></div>
    </div>

    <div class="mt-5 d-none" id="onboarding-continue-wrap">
      <a href="mentor-dashboard.html" class="btn btn-mentor w-100">Continue to dashboard →</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
const user = requireRole("mentor");
const isOnboarding = new URLSearchParams(window.location.search).get("onboarding") === "1";
if (isOnboarding) {
  document.getElementById("onboarding-note").textContent = "Almost done — take a look at students already asking for you, then continue to your dashboard whenever you're ready.";
  document.getElementById("onboarding-continue-wrap").classList.remove("d-none");
}

function renderRequests() {
  const pending = getPendingRequestsForMentor(user.id);
  const wrap = document.getElementById("requests-list");
  wrap.innerHTML = pending.length ? pending.map(r => `
    <div class="request-row">
      <div>
        <strong>${r.menteeName}</strong>
        <div class="small text-secondary">${r.subject}</div>
        <div class="small text-secondary">${r.note || "No note added."}</div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-tm btn-sm" onclick="handleRespond('${r.id}', false)">Decline</button>
        <button class="btn btn-mentor btn-sm" onclick="handleRespond('${r.id}', true)">Accept</button>
      </div>
    </div>`).join("") : `<p class="text-secondary">No pending requests right now — accepted students will show up below once mentees reach out.</p>`;
}

function renderRoster() {
  const roster = getRoster(user.id);
  const wrap = document.getElementById("roster-list");
  wrap.innerHTML = roster.length ? roster.map(s => `
    <div class="col-md-6">
      <div class="feature-card d-flex align-items-center gap-3">
        <div class="avatar-ring" style="width:44px;height:44px;font-size:.9rem;">${initials(s.name)}</div>
        <div>
          <strong>${s.name}</strong>
          <div class="small text-secondary">${s.subject}</div>
        </div>
      </div>
    </div>`).join("") : `<p class="text-secondary">No students accepted yet.</p>`;
}

function handleRespond(requestId, accept) {
  respondToRequest(requestId, accept);
  renderRequests();
  renderRoster();
}

renderRequests();
renderRoster();
renderNavbar("navbar-mount");
</script>
</body>
</html>
