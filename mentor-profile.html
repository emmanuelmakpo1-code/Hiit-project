<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor profile — TutorMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-shell">
  <div class="container" style="max-width: 900px;">
    <span class="section-label">Mentor profile</span>
    <h2 class="mt-2 mb-1" id="page-title">Build your credentials card</h2>
    <p class="text-secondary mb-4" id="page-subtitle">This is what mentees see when they browse. Stronger credentials mean more bookings.</p>

    <div class="row g-4">
      <div class="col-lg-7">
        <form id="profile-form" class="bg-paper-raised rounded-tm shadow-tm p-4">
          <div class="mb-3">
            <label class="form-label">Short bio</label>
            <textarea class="form-control" id="p-bio" rows="3" placeholder="A sentence or two about what you're studying and how you like to teach."></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">CGPA</label>
              <input type="number" step="0.01" min="0" max="5" class="form-control" id="p-cgpa">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Subjects / courses you mentor</label>
              <input type="text" class="form-control" id="p-subjects" placeholder="comma separated">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Awards</label>
            <input type="text" class="form-control" id="p-awards" placeholder="comma separated, e.g. Dean's List, Best Project 2025">
          </div>
          <div class="mb-3">
            <label class="form-label">Merits</label>
            <input type="text" class="form-control" id="p-merits" placeholder="comma separated">
          </div>
          <div class="mb-4">
            <label class="form-label">Certifications</label>
            <input type="text" class="form-control" id="p-certs" placeholder="comma separated">
          </div>
          <button type="submit" class="btn btn-mentor w-100" id="save-btn">Save profile</button>
          <div id="save-toast" class="text-success small mt-2 d-none">Profile saved.</div>
        </form>
      </div>

      <div class="col-lg-5">
        <span class="section-label d-block mb-2">Live preview</span>
        <div class="credential-card" id="preview-card"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
const user = requireRole("mentor");
const isOnboarding = new URLSearchParams(window.location.search).get("onboarding") === "1";
if (isOnboarding) {
  document.getElementById("page-title").textContent = "Almost there — set up your credentials";
  document.getElementById("page-subtitle").textContent = "Add what makes you a strong mentor, then we'll take you to pick your first students.";
  document.getElementById("save-btn").textContent = "Save & continue →";
}

function renderPreviewCard(m) {
  document.getElementById("preview-card").innerHTML = `
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="avatar-ring">${initials(m.name)}</div>
      <div>
        <h5 class="mb-0">${m.name}</h5>
        <span class="text-secondary small">${m.rating ? "⭐ " + m.rating + " · " + (m.sessionsHosted||0) + " sessions" : "New mentor"}</span>
      </div>
    </div>
    <p class="small text-secondary">${m.bio || "No bio yet — add one so mentees know your style."}</p>
    <div class="stat-strip">
      <span class="stat-chip">CGPA <strong>${m.cgpa || "—"}</strong></span>
      <span class="stat-chip">Awards <strong>${(m.awards||[]).length}</strong></span>
      <span class="stat-chip">Merits <strong>${(m.merits||[]).length}</strong></span>
      <span class="stat-chip">Certs <strong>${(m.certifications||[]).length}</strong></span>
    </div>
    <div class="d-flex flex-wrap gap-2">
      ${(m.subjects||[]).map(s => `<span class="badge-subject">${s}</span>`).join("") || `<span class="text-secondary small">No subjects added yet</span>`}
    </div>
  `;
}

function loadForm() {
  document.getElementById("p-bio").value = user.bio || "";
  document.getElementById("p-cgpa").value = user.cgpa || "";
  document.getElementById("p-subjects").value = (user.subjects || []).join(", ");
  document.getElementById("p-awards").value = (user.awards || []).join(", ");
  document.getElementById("p-merits").value = (user.merits || []).join(", ");
  document.getElementById("p-certs").value = (user.certifications || []).join(", ");
  renderPreviewCard(user);
}
loadForm();

function csv(id) {
  return document.getElementById(id).value.split(",").map(s => s.trim()).filter(Boolean);
}

["p-bio","p-cgpa","p-subjects","p-awards","p-merits","p-certs"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    renderPreviewCard({
      ...user,
      bio: document.getElementById("p-bio").value,
      cgpa: parseFloat(document.getElementById("p-cgpa").value) || null,
      subjects: csv("p-subjects"), awards: csv("p-awards"), merits: csv("p-merits"), certifications: csv("p-certs")
    });
  });
});

document.getElementById("profile-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const updated = {
    ...user,
    bio: document.getElementById("p-bio").value,
    cgpa: parseFloat(document.getElementById("p-cgpa").value) || null,
    subjects: csv("p-subjects"), awards: csv("p-awards"), merits: csv("p-merits"), certifications: csv("p-certs")
  };
  const users = getUsers().map(u => u.id === updated.id ? updated : u);
  saveUsers(users);
  setCurrentUser(updated);

  if (isOnboarding) {
    window.location.href = "mentor-requests.html?onboarding=1";
    return;
  }

  document.getElementById("save-toast").classList.remove("d-none");
  setTimeout(() => document.getElementById("save-toast").classList.add("d-none"), 2000);
});

renderNavbar("navbar-mount");
</script>
</body>
</html>
