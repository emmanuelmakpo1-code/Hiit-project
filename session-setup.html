<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a session — TutorMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-shell">
  <div class="container" style="max-width: 760px;">
    <span class="section-label">New session</span>
    <h2 class="mt-2 mb-4">Set up a session</h2>

    <form id="session-form" class="bg-paper-raised rounded-tm shadow-tm p-4">
      <div class="mb-3">
        <label class="form-label">Session title</label>
        <input type="text" class="form-control" id="s-title" required placeholder="e.g. Big-O Notation, Demystified">
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" id="s-subject" required placeholder="e.g. Algorithms">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Date & time</label>
          <input type="datetime-local" class="form-control" id="s-datetime" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" id="s-description" rows="3" placeholder="What will this session cover?"></textarea>
      </div>

      <label class="form-label d-block">Location</label>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <input type="radio" class="btn-check" name="loc-type" id="loc-online" checked>
          <label class="btn btn-outline-tm w-100" for="loc-online">💻 Online</label>
        </div>
        <div class="col-6">
          <input type="radio" class="btn-check" name="loc-type" id="loc-inperson">
          <label class="btn btn-outline-tm w-100" for="loc-inperson">📍 In-person</label>
        </div>
      </div>

      <div class="mb-4 d-none" id="location-detail-wrap">
        <label class="form-label">Campus location</label>
        <select class="form-select" id="s-location-detail">
                  </select>
      </div>

      <button type="submit" class="btn btn-mentor w-100">Create session</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
const user = requireRole("mentor");

const locSelect = document.getElementById("s-location-detail");
LOCATIONS.forEach(loc => {
  const opt = document.createElement("option"); opt.value = loc; opt.textContent = loc; locSelect.appendChild(opt);
});

function toggleLocationDetail() {
  document.getElementById("location-detail-wrap").classList.toggle("d-none", !document.getElementById("loc-inperson").checked);
}
document.getElementById("loc-online").addEventListener("change", toggleLocationDetail);
document.getElementById("loc-inperson").addEventListener("change", toggleLocationDetail);

document.getElementById("session-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const isOnline = document.getElementById("loc-online").checked;
  const newSession = {
    id: "s_" + Date.now(),
    mentorId: user.id,
    mentorName: user.name,
    title: document.getElementById("s-title").value.trim(),
    subject: document.getElementById("s-subject").value.trim(),
    description: document.getElementById("s-description").value.trim(),
    locationType: isOnline ? "online" : "in-person",
    locationDetail: isOnline ? "" : locSelect.value,
    datetime: document.getElementById("s-datetime").value,
    attendees: []
  };
  const sessions = getSessions();
  sessions.push(newSession);
  saveSessions(sessions);
  window.location.href = `room.html?session=${newSession.id}`;
});

renderNavbar("navbar-mount");
</script>
</body>
</html>
